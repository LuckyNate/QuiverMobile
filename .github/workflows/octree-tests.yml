name: Octree Engine Tests
on:
  push:
    paths:
      - 'web/src/engine/**'
      - 'web/test/**'
      - '.github/workflows/octree-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test unified world octree
        run: node --test web/test/world-octree.test.js
