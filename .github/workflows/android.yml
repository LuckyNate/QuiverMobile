name: Android Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quivermobile-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSWORD: ${{ secrets.QUIVER_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Initialize or restore persistent release key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_PASSWORD" ] || [ "${#SIGNING_PASSWORD}" -lt 16 ]; then
            echo "::error::Set QUIVER_SIGNING_PASSWORD to a strong password of at least 16 characters under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p signing
          if [ -f signing/QuiverMobile.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in signing/QuiverMobile.jks.enc -out "$RUNNER_TEMP/QuiverMobile.jks" -pass env:SIGNING_PASSWORD
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/QuiverMobile.jks" -alias quivermobile -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=QuiverMobile, OU=Development, O=QuiverMobile, C=US" -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD"
            openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt -in "$RUNNER_TEMP/QuiverMobile.jks" -out signing/QuiverMobile.jks.enc -pass env:SIGNING_PASSWORD
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add signing/QuiverMobile.jks.enc
            git commit -m "Store encrypted QuiverMobile signing identity"
            git push origin HEAD:main
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/QuiverMobile.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=quivermobile" >> "$GITHUB_ENV"
      - name: Install and validate Android NDK (with retries)
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.0.12077973"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          for attempt in 1 2 3; do
            if [ -f "$NDK_DIR/source.properties" ] && grep -q "Pkg.Revision = $NDK_VERSION" "$NDK_DIR/source.properties"; then
              echo "Verified Android NDK $NDK_VERSION"
              break
            fi
            rm -rf "$NDK_DIR"
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" && [ -f "$NDK_DIR/source.properties" ]; then
              echo "Android NDK installed successfully"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::NDK download failed three times"
              exit 1
            fi
            sleep 10
          done
          test -x "$NDK_DIR/ndk-build"
      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk QuiverMobile.apk
          jarsigner -verify -certs QuiverMobile.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: QuiverMobile-release
          path: QuiverMobile.apk
      - name: Publish in-app update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: QuiverMobile v${{ github.run_number }}
          target_commitish: main
          files: QuiverMobile.apk
          make_latest: true
          generate_release_notes: true
