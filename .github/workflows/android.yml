name: Android Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Require persistent release signing
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets to enable consistently signed updates."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quiver-signing.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/quiver-signing.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk QuiverMobile.apk
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuiverMobile-release
          path: QuiverMobile.apk
      - name: Publish in-app update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: QuiverMobile v${{ github.run_number }}
          files: QuiverMobile.apk
          make_latest: true
          generate_release_notes: true
