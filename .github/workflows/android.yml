name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore permanent signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quiver-signing.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/quiver-signing.jks" >> "$GITHUB_ENV"
      - name: Build versioned debug APK
        run: gradle :app:assembleDebug -PappVersionCode=${{ github.run_number }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QuiverMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          gradle :app:assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace
          cp app/build/outputs/apk/release/app-release.apk QuiverMobile.apk
      - name: Publish in-app update release
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: QuiverMobile v${{ github.run_number }}
          files: QuiverMobile.apk
          make_latest: true
          generate_release_notes: true
