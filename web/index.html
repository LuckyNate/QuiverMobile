<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>QuiverGL</title></head>
<body style="margin:0;background:#090c14;color:#fff;font-family:monospace;overflow:hidden">
<div id="bootstrap" style="position:fixed;top:56px;left:8px;z-index:20;background:#000c;padding:8px;max-width:90vw;white-space:pre-wrap">QuiverGL: loading web engine…</div>
<div id="app"></div>
<script>
window.addEventListener('error',function(e){
 var b=document.getElementById('bootstrap');if(b){b.textContent='QuiverGL startup error: '+(e.message||'Resource failed');}
});
window.addEventListener('unhandledrejection',function(e){
 var b=document.getElementById('bootstrap');if(b){b.textContent='QuiverGL startup rejected: '+(e.reason?.message||String(e.reason));}
});
</script>
<script type="module" src="/src/main.js"></script></body></html>
